<style>

e;top:-478px;image-rendering:pixelated}.team-hero.sangqi .team-portrait img{left:0}.team-hero.lan .team-portrait img{left:-522px}.team-hero.baiqi .team-portrait img{left:-1025px}.team-ring{position:absolute;left:50%;bottom:14px;width:150px;height:25px;transform:translateX(-50%);border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent);opacity:0;transition:opacity 1s}.team-hero.show .team-ring{opacity:.7}.team-label{position:absolute;left:0;right:0;bottom:-4px;text-align:center;color:var(--accent);font-size:16px;letter-spacing:.15em}.team-label small{display:block;color:#adc2c3;font-size:12px;letter-spacing:.08em;margin-top:6px}.team-hero.sangqi{--accent:#cce890}.team-hero.lan{--accent:#7dd4ff}.team-hero.baiqi{--accent:#ffaaaa}.team-dialog{position:absolute;z-index:3;left:6.5%;right:6.5%;bottom:34px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 22px 18px 28px;background:#081827e8;border:1px solid #a9c3b84d;box-shadow:4px 4px 0 #07131e,5px 5px 0 #60786f}.team-dialog p{margin:0;font-size:17px;line-height:1.6}.team-speaker{display:block;color:#c8f1b7;font-size:12px;letter-spacing:.14em;margin-bottom:4px}.team-actions{display:flex;gap:10px}.team-actions button{background:#c8f1b7;color:#14362d;border:1px solid #e2ffd7;padding:12px 18px;cursor:pointer;font-size:14px;white-space:nowrap}.team-actions button.secondary{background:#102638;color:#dbeadf;border-color:#6a858c}.team-stage.done .team-road{box-shadow:0 0 32px #c8f1b7}.team-stage.done .team-title{color:#dff6d2}.team-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#213a48;z-index:4}.team-progress span{display:block;width:0;height:100%;background:#c8f1b7;transition:width .2s linear}
.team-stage{background:linear-gradient(90deg,#132d38d9 0%,#183b426e 50%,#0c24384c 100%),url('opening-art.png?v=4') center/cover;animation:encounterPan 13s ease-in-out infinite alternate}.team-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08182924 0%,transparent 46%,#071522d9 100%);z-index:-1;pointer-events:none}.team-heroes{justify-content:flex-end}.team-hero.lan,.team-hero.baiqi{display:none}.team-hero.sangqi{width:52%;margin-right:5%}.team-stage .team-title{max-width:540px}.team-stage .team-subtitle{max-width:440px}.team-stage .team-hint{background:#0b202ad1;border:1px solid #bdd5c14d;padding:9px 12px}.team-stage .team-dialog{background:#0b202af0;border-color:#bdd5c16b}.team-stage .team-kicker{color:#d7f09a}.team-stage.show .team-portrait{animation:sangqiBreathe 2.8s ease-in-out infinite}.team-stage.show .team-ring{animation:ringPulse 2.2s ease-in-out infinite}.team-stage.show:before{animation:fireflyField 5.5s ease-in-out infinite alternate}
@keyframes encounterPan{0%{background-position:48% 50%}100%{background-position:56% 47%}}@keyframes sangqiBreathe{0%,100%{margin-bottom:0;transform:translateX(-50%) translateY(0)}50%{margin-bottom:6px;transform:translateX(-50%) translateY(-4px)}}@keyframes ringPulse{0%,100%{opacity:.38;box-shadow:0 0 12px #cce89033}50%{opacity:1;box-shadow:0 0 32px #cce890a8}}@keyframes fireflyField{0%{filter:brightness(.98) saturate(1)}100%{filter:brightness(1.12) saturate(1.15)}}
.encounter-fireflies{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.encounter-fireflies i{position:absolute;left:var(--x);top:var(--y);width:4px;height:4px;border-radius:50%;background:#f7efaa;box-shadow:0 0 12px 3px #f4e99b;opacity:.15;animation:encounterFloat var(--d) ease-in-out infinite var(--delay)}@keyframes encounterFloat{0%,100%{opacity:.1;transform:translate(0,12px) scale(.65)}45%{opacity:.85;transform:translate(10px,-12px) scale(1)}75%{opacity:.38;transform:translate(-7px,-28px) scale(.78)}}
@media(max-width:760px){main{padding:16px 16px 20px}header{margin-bottom:14px;font-size:12px;letter-spacing:.06em}.identity{gap:8px}.game,.team-stage{height:calc(100svh - 110px);min-height:700px;max-height:none}.hud{top:20px;left:20px;right:20px}.chapter{font-size:12px}.art{object-position:73% 50%;height:91%}.shade{background:linear-gradient(180deg,#08172899,transparent 65%,#071625b0)}.intro{left:8%;right:7%;top:16%}h1{font-size:clamp(30px,7.5vw,49px)}.intro p{max-width:250px;font-size:14px}.eyebrow{font-size:12px;margin-bottom:16px;letter-spacing:.14em}.dialog{left:6%;right:6%;bottom:28px;padding:24px 21px 22px;grid-template-columns:1fr;gap:16px;min-height:206px}.dialog-text{font-size:16px;min-height:60px}.dialog-help{display:none}.primary{width:100%;padding:13px 22px}.speaker{left:15px;font-size:12px}.corner-label{bottom:263px;font-size:12px}footer{font-size:12px;letter-spacing:.04em}footer .subfooter{display:none}.sound{font-size:12px;padding:8px}.date{letter-spacing:.1em}.team-stage{padding:26px 7% 30px}.team-top{display:block}.team-kicker{font-size:11px}.team-title{font-size:32px;margin-top:12px}.team-subtitle{font-size:14px}.team-hint{display:block;margin-top:12px}.team-heroes{left:1%;right:1%;bottom:175px;height:300px}.team-hero{width:33.33%;height:300px}.team-hero.sangqi{width:70%;margin-right:0}.team-portrait{transform:translateX(-50%) scale(.78);transform-origin:bottom center;bottom:14px}.team-label{font-size:13px;bottom:-1px}.team-label small{font-size:10px}.team-dialog{left:6%;right:6%;bottom:25px;padding:17px 16px;display:block}.team-dialog p{font-size:14px;min-height:50px}.team-actions{margin-top:12px}.team-actions button{flex:1;padding:10px 8px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.game.started .art{transform:none}}

<body>
<main>
<header><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>A LITTLE BIRTHDAY ADVENTURE</span></div><span class="date">10.15</span></header>
<section class="game" id="game" aria-label="生日冒险开场">
<img class="art" src="opening-art.png?v=4" alt="暮色中的像素草地，小八和吉伊、乌萨奇在小路旁等候。" fetchpriority="high">
<div class="shade"></div><div class="corners"></div><div class="fireflies" id="fireflies" aria-hidden="true"></div>
<div class="hud"><span class="chapter">PROLOGUE / 序章</span><button class="sound" id="sound" aria-pressed="false" aria-label="开启交互音效"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLabel">音效 OFF</span></button></div>
<div class="intro" id="intro"><div class="eyebrow">NEW QUEST DETECTED</div><h1>今天好像有一个<br>特殊任务。</h1><p>小八已经先到了。<br>就等你一起出发。</p></div>
<div class="corner-label" aria-hidden="true">HACHIWARE & FRIENDS</div>
<div class="dialog"><div class="speaker" id="speaker">小八</div><div><p class="dialog-text" id="dialogText" aria-live="polite">你来啦。<br>有一些线索，想和你一起打开。</p><div class="dialog-help" id="hint">点击开始，或者按 Enter</div></div><button class="primary" id="next">开始冒险 <span aria-hidden="true">▶</span></button></div>
</section>
<section class="team-stage" id="teamStage" aria-label="路上偶遇桑启" aria-hidden="true">
<div class="team-top"><div><div class="team-kicker">ENCOUNTER 01 / 路上偶遇</div><h2 class="team-title">小八遇见了新朋友。</h2><p class="team-subtitle">前面的萤火，好像在给我们指路。</p></div><span class="team-hint">好友集 · 01 / 06</span></div>
<div class="team-road" aria-hidden="true"></div>
<div class="encounter-fireflies" id="encounterFireflies" aria-hidden="true"></div>
<div class="team-heroes" aria-hidden="true">
<div class="team-hero sangqi" id="teamSangqi"><div class="team-portrait"><img src="characters-transparent.png" alt="桑启像素小人"></div><div class="team-ring"></div><div class="team-label">桑启<small>我方小萤火</small></div></div>
</div>
<div class="team-dialog"><p><span class="team-speaker" id="teamSpeaker">小八</span><span id="teamMessage">前面有一只小萤火，好像在等我们。</span></p><div class="team-actions"><button class="secondary" id="teamReplay">重看相遇</button><button id="teamNext">继续赶路 <span aria-hidden="true">▶</span></button></div></div>
<div class="team-progress" aria-hidden="true"><span id="teamProgress"></span></div>
</section>
<footer><span>FOR YOU, ON YOUR SPECIAL DAY</span><span class="subfooter">小小冒险，正在开始</span><span class="counter">00 <em>/ 序章</em></span></footer>
</main>
<script>
const game=document.getElementById('game'),next=document.getElementById('next'),dialog=document.getElementById('dialogText'),hint=document.getElementById('hint'),teamStage=document.getElementById('teamStage');
const teamSangqi=document.getElementById('teamSangqi'),teamSpeaker=document.getElementById('teamSpeaker'),teamMessage=document.getElementById('teamMessage'),teamProgress=document.getElementById('teamProgress');
let step=0,audioEnabled=false,audioContext=null,teamElapsed=0,teamRunning=false,teamRAF={id:0,last:0},teamCue=-1;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduced){const f=document.getElementById('fireflies');for(let i=0;i<16;i++){const el=document.createElement('i');el.style.setProperty('--x',`${10+(i*37)%82}%`);el.style.setProperty('--y',`${33+(i*19)%40}%`);el.style.setProperty('--d',`${3+i%4}s`);el.style.setProperty('--delay',`-${i*.7}s`);f.appendChild(el)}}
if(!reduced){const f=document.getElementById('encounterFireflies');for(let i=0;i<14;i++){const el=document.createElement('i');el.style.setProperty('--x',`${8+(i*43)%86}%`);el.style.setProperty('--y',`${24+(i*31)%53}%`);el.style.setProperty('--d',`${3.8+i%4}s`);el.style.setProperty('--delay',`-${i*.55}s`);f.appendChild(el)}}
function chime(){if(!audioEnabled)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();[523.25,659.25].forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.08;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.21)})}catch{audioEnabled=false;updateSound()}}
function updateSound(){const b=document.getElementById('sound');b.setAttribute('aria-pressed',String(audioEnabled));b.setAttribute('aria-label',audioEnabled?'关闭交互音效':'开启交互音效');document.getElementById('soundLabel').textContent=audioEnabled?'音效 ON':'音效 OFF'}
document.getElementById('sound').addEventListener('click',()=>{audioEnabled=!audioEnabled;updateSound();chime()});
const teamCues=[{at:0,speaker:'小八',text:'前面有一只小萤火，好像在等我们。'},{at:3200,speaker:'桑启',text:'你们也要去找生日线索吗？'},{at:6500,speaker:'小八',text:'嗯！那就一起走吧。'},{at:9800,speaker:'好友集 + 1',text:'桑启加入了我们的旅程。'},{at:13000,speaker:'继续赶路',text:'前面的路亮了，我们还会遇见更多朋友。'}];
function renderTeam(){const idx=teamCues.findLastIndex(c=>teamElapsed>=c.at);if(idx!==teamCue){teamCue=idx;teamSpeaker.textContent=teamCues[idx].speaker;teamMessage.textContent=teamCues[idx].text}teamSangqi.classList.toggle('show',teamElapsed>=0);teamStage.classList.toggle('done',teamElapsed>=9500);teamProgress.style.width=`${Math.min(100,teamElapsed/13000*100)}%`}
function teamTick(now){if(!teamRunning)return;teamElapsed=Math.min(13000,teamElapsed+now-teamRAF.last);teamRAF.last=now;renderTeam();if(teamElapsed>=13000){teamRunning=false;teamMessage.textContent='前面的路亮了，我们还会遇见更多朋友。';teamSpeaker.textContent='继续赶路';return}teamRAF.id=requestAnimationFrame(teamTick)}
function startTeam(){cancelAnimationFrame(teamRAF.id);game.style.display='none';teamStage.classList.add('show');teamStage.setAttribute('aria-hidden','false');teamElapsed=0;teamCue=-1;teamRunning=true;teamRAF.last=performance.now();renderTeam();teamRAF.id=requestAnimationFrame(teamTick)}
function replayTeam(){teamElapsed=0;teamCue=-1;teamRunning=true;teamStage.classList.remove('done');teamRAF.last=performance.now();renderTeam();cancelAnimationFrame(teamRAF.id);teamRAF.id=requestAnimationFrame(teamTick)}
function leaveTeam(){teamRunning=false;cancelAnimationFrame(teamRAF.id);teamStage.classList.remove('show');teamStage.setAttribute('aria-hidden','true');game.style.display='block';step=2;dialog.innerHTML='桑启已经加入好友集。<br>小八还要继续带你往前走。';next.innerHTML='再看一次偶遇 <span aria-hidden="true">↻</span>';hint.textContent='点击按钮重新进入相遇片段'}
function advance(){chime();if(step===0){step=1;game.classList.add('started');dialog.innerHTML='今天的任务有一点特别。<br>剩下的线索，要自己一点点打开。';next.innerHTML='我准备好了 <span aria-hidden="true">▶</span>';hint.textContent='点击继续，或者按 Enter'}else if(step===1){step=2;dialog.innerHTML='那就约好啦。<br>接下来的冒险，我们一起。';next.innerHTML='继续赶路 <span aria-hidden="true">▶</span>';hint.textContent='前方好像有新的朋友'}else{startTeam()}}
document.getElementById('teamReplay').addEventListener('click',replayTeam);document.getElementById('teamNext').addEventListener('click',leaveTeam);
next.addEventListener('click',advance);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat&&e.target===document.body){e.preventDefault();advance()}});
</script>
</body>
</html>
